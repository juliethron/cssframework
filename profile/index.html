<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>

    <link rel="stylesheet" href="/src/input.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-white shadow p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">Profile</h1>

        <nav class="space-x-4">
        <a href="/" class="text-blue-500">Login</a>
        <a href="/feed/" class="text-blue-500">Feed</a>
        </nav>
    </div>
    </header>

    <main class="max-w-5xl mx-auto p-4">

    
    <section class="bg-white rounded-2xl shadow p-6 mb-6">

        <div class="flex flex-col md:flex-row items-center gap-6">

        <img
            src="https://i.pravatar.cc/200"
            alt="Profile"
            class="w-32 h-32 rounded-full object-cover"
        />

        <div class="text-center md:text-left">

            <h2 class="text-3xl font-bold mb-2">
            JulieThron
            </h2>

            <div class="flex gap-6 justify-center md:justify-start mb-4">

            <div>
                <p class="font-bold">320</p>
                <p class="text-gray-500">Followers</p>
            </div>

            <div>
                <p class="font-bold">180</p>
                <p class="text-gray-500">Following</p>
            </div>

        </div>

            <button
            class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition"
            >
            Follow
            </button>

        </div>

        </div>

    </section>

    
    <section>

        <h3 class="text-2xl font-bold mb-4">
        User Posts
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <article class="bg-white rounded-xl shadow overflow-hidden">

            <img
            src="https://picsum.photos/400/300"
            alt="Post"
            class="w-full h-48 object-cover"
            />

            <div class="p-4">
            <h4 class="font-bold mb-2">
                Vacation Photo
            </h4>

            <p class="text-gray-600">
                Exploring new places ✈️
            </p>
            </div>

        </article>

        <article class="bg-white rounded-xl shadow overflow-hidden">

            <img
            src="https://picsum.photos/401/300"
            alt="Post"
            class="w-full h-48 object-cover"
            />

            <div class="p-4">
            <h4 class="font-bold mb-2">
                Coffee Time
            </h4>

            <p class="text-gray-600">
                Morning vibes ☕
            </p>
            </div>

        </article>

        <article class="bg-white rounded-xl shadow overflow-hidden">

            <img
            src="https://picsum.photos/402/300"
            alt="Post"
            class="w-full h-48 object-cover"
            />

            <div class="p-4">
            <h4 class="font-bold mb-2">
                Study Session
            </h4>

            <p class="text-gray-600">
                Working on front-end projects 💻
            </p>
            </div>

        </article>

        </div>

    </section>

    </main>

</body>
</html>
