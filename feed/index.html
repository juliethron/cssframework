<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed</title>

    <link rel="stylesheet" href="/src/input.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <header class="bg-white shadow p-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">Social Feed</h1>

        <nav class="space-x-4">
        <a href="/" class="text-blue-500">Login</a>
        <a href="/profile/" class="text-blue-500">Profile</a>
        </nav>
    </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 space-y-6">

    
    <section class="flex flex-col md:flex-row gap-4">

        <input
        type="text"
        placeholder="Search posts..."
        class="flex-1 p-3 rounded-lg border"
        />

        <select class="p-3 rounded-lg border">
        <option>Newest</option>
        <option>Popular</option>
        </select>

    </section>

    <section class="bg-white p-4 rounded-xl shadow">

        <h2 class="text-xl font-bold mb-4">
        Create Post
        </h2>

        <form class="space-y-4">

        <input
            type="text"
            placeholder="Post title"
            class="w-full p-3 border rounded-lg"
        />

        <textarea
            placeholder="What's happening?"
            class="w-full p-3 border rounded-lg"
        ></textarea>

        <button
            class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition"
        >
            Post
        </button>

        </form>

    </section>

    <section class="grid gap-6">

        <article class="bg-white rounded-xl shadow overflow-hidden">

        <img
            src="https://picsum.photos/800/400"
            alt="Post"
            class="w-full h-64 object-cover"
        />

        <div class="p-4">
            <h3 class="text-xl font-bold mb-2">
            My First Post
            </h3>

            <p class="text-gray-600">
            Lorem ipsum dolor sit amet consectetur adipisicing elit.
            </p>
        </div>

        </article>

        <article class="bg-white rounded-xl shadow overflow-hidden">

        <img
            src="https://picsum.photos/800/401"
            alt="Post"
            class="w-full h-64 object-cover"
        />

        <div class="p-4">
            <h3 class="text-xl font-bold mb-2">
            Another Post
            </h3>

            <p class="text-gray-600">
            Responsive layouts with Tailwind are actually nice.
            </p>
        </div>

        </article>

    </section>

    </main>

</body>
</html>
